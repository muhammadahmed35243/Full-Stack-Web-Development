<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ConnecFriend – Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/custom.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>

  <main class="container py-4">
    <div id="profileError" class="alert alert-danger d-none"></div>
    <div class="row g-4" id="profileBody">
      <section class="col-lg-4">
        <div class="card shadow-sm text-center">
          <div class="card-body" id="profileCard"></div>
        </div>
      </section>

      <section class="col-lg-8">
        <div class="card shadow-sm mb-4 d-none" id="requestsCard">
          <div class="card-header bg-white fw-semibold">Friend requests</div>
          <ul class="list-group list-group-flush" id="requestList"></ul>
        </div>

        <div class="card shadow-sm mb-4">
          <div class="card-header bg-white fw-semibold"><i class="bi bi-people text-brand"></i> Friends <span class="badge text-bg-secondary" id="friendCount"></span></div>
          <ul class="list-group list-group-flush" id="friendList"></ul>
        </div>

        <div class="card shadow-sm d-none" id="ignoreCard">
          <div class="card-header bg-white fw-semibold"><i class="bi bi-slash-circle text-danger"></i> Ignore list</div>
          <div class="card-body">
            <p class="small text-muted">Members on this list cannot send you friend requests. Ignoring a friend also removes the friendship.</p>
            <div class="input-group mb-3">
              <select id="ignoreSelect" class="form-select" aria-label="Member to ignore"></select>
              <button class="btn btn-outline-danger" id="ignoreBtn">Ignore</button>
            </div>
            <ul class="list-group" id="ignoreList"></ul>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/friends.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
