<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ConnecFriend – Sign in</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/custom.css" rel="stylesheet">
</head>
<body>
  <main class="login-wrap d-flex align-items-center py-4">
    <div class="container">
      <div class="row justify-content-center align-items-center g-4">
        <div class="col-lg-5 text-white text-center text-lg-start">
          <h1><i class="bi bi-link-45deg"></i> Connec<span style="color:#fbbf24">Friend</span></h1>
          <p class="lead opacity-75">Stay close to the people who matter. Share news, rate your circle and chat privately.</p>
          <div id="crew" class="d-flex mt-4 justify-content-center justify-content-lg-start" aria-hidden="true"></div>
          <p class="small opacity-75 mt-2">Join the friends already connected.</p>
        </div>
        <div class="col-md-8 col-lg-5">
          <div class="card shadow border-0">
            <div class="card-body p-4">
              <h2 class="heading-font h3 mb-1">Welcome back</h2>
              <p class="text-muted mb-4">Sign in to see what your friends are up to.</p>
              <div id="loginError" class="alert alert-danger d-none" role="alert"></div>
              <form id="loginForm" novalidate>
                <div class="mb-3">
                  <label for="username" class="form-label">Username</label>
                  <div class="input-group has-validation">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" autocomplete="username" required>
                    <div class="invalid-feedback">Please enter your username.</div>
                  </div>
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <div class="input-group has-validation">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" autocomplete="current-password" required>
                    <button class="btn btn-outline-secondary" type="button" id="togglePw" aria-label="Show password"><i class="bi bi-eye"></i></button>
                    <div class="invalid-feedback">Please enter your password.</div>
                  </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign in</button>
              </form>
              <hr>
              <button class="btn btn-link btn-sm p-0" id="resetData">Reset demo data</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (CF.auth.current()) window.location.replace('home.html');

    document.getElementById('crew').innerHTML = CF.db.users().map((u) => CF.ui.avatar(u, 46)).join('');

    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('loginError');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      errorBox.classList.add('d-none');
      form.classList.add('was-validated');
      if (!form.checkValidity()) return;
      try {
        CF.auth.login(form.username.value, form.password.value);
        window.location.href = 'home.html';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove('d-none');
      }
    });

    document.getElementById('togglePw').addEventListener('click', () => {
      const pw = document.getElementById('password');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    });

    document.getElementById('resetData').addEventListener('click', () => {
      CF.db.reset();
      errorBox.classList.add('d-none');
      CF.ui.toast('Demo data has been reset.');
    });
  </script>
</body>
</html>
