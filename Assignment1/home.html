<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ConnecFriend – Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/custom.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>

  <main class="container py-4">
    <section class="welcome p-3 p-md-4 mb-4 d-flex flex-wrap align-items-center gap-3" id="welcome" aria-label="Welcome"></section>
    <div class="row g-4">
      <!-- Friends ordered by most recent login -->
      <aside class="col-lg-3 order-2 order-lg-1">
        <div class="card shadow-sm">
          <div class="card-header bg-white fw-semibold"><i class="bi bi-people text-brand"></i> Friends <small class="text-muted">(latest login first)</small></div>
          <ul class="list-group list-group-flush" id="friendList"></ul>
        </div>
      </aside>

      <section class="col-lg-6 order-1 order-lg-2">
        <div class="card shadow-sm mb-4">
          <div class="card-body">
            <form id="postForm" novalidate>
              <label for="postText" class="form-label fw-semibold">Share some news</label>
              <textarea id="postText" class="form-control" rows="3" maxlength="500" placeholder="What's new?"></textarea>
              <div class="d-flex justify-content-between small text-muted mt-1"><span id="postError" class="text-danger"></span><span><span id="charCount">0</span>/500</span></div>

              <div class="mt-2">
                <span class="form-label d-block fw-semibold">Share with</span>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="audience" id="audAll" value="all" checked>
                  <label class="form-check-label" for="audAll">All friends</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="audience" id="audSome" value="some">
                  <label class="form-check-label" for="audSome">Some friends</label>
                </div>
              </div>
              <div id="friendPicker" class="border rounded p-2 mt-2 d-none"></div>

              <button type="submit" class="btn btn-primary mt-3"><i class="bi bi-send"></i> Share</button>
            </form>
          </div>
        </div>

        <h2 class="h5 mb-3 text-white feed-title">News from your friends</h2>
        <div id="feedList"></div>
      </section>

      <aside class="col-lg-3 order-3">
        <div class="card shadow-sm mb-4 d-none" id="requestsCard">
          <div class="card-header bg-white fw-semibold"><i class="bi bi-envelope-heart text-brand"></i> Friend requests</div>
          <ul class="list-group list-group-flush" id="requestList"></ul>
        </div>
        <div class="card shadow-sm">
          <div class="card-header bg-white fw-semibold"><i class="bi bi-person-plus text-brand"></i> People you may know</div>
          <ul class="list-group list-group-flush" id="suggestList"></ul>
        </div>
      </aside>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/friends.js"></script>
  <script src="js/feed.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
