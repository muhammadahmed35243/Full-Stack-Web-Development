<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ConnecFriend – Messages</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/custom.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>

  <main class="container py-4">
    <div class="card overflow-hidden">
      <div class="row g-0">
        <aside class="col-md-4 border-end" id="convPane">
          <div class="chat-head p-3 d-flex justify-content-between align-items-center">
            <h1 class="heading-font mb-0">Messages</h1>
            <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#newModal"><i class="bi bi-pencil-square"></i> New</button>
          </div>
          <div class="list-group list-group-flush conv-list" id="convList"></div>
        </aside>

        <section class="col-md-8 d-flex flex-column" id="threadPane">
          <div class="chat-head p-3 d-flex align-items-center gap-2" id="threadHeader"></div>
          <div class="chat-body p-3" id="threadBody"></div>
          <form id="msgForm" class="chat-input p-2 d-flex gap-2" novalidate>
            <textarea id="msgInput" class="form-control" rows="1" maxlength="500" placeholder="Type a message (Enter to send)" aria-label="Message"></textarea>
            <button class="btn btn-primary" type="submit" aria-label="Send"><i class="bi bi-send"></i></button>
          </form>
        </section>
      </div>
    </div>
  </main>

  <!-- Pick any member, friend or not -->
  <div class="modal fade" id="newModal" tabindex="-1" aria-labelledby="newModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="newModalTitle">New message</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="search" id="memberSearch" class="form-control mb-3" placeholder="Search members" aria-label="Search members">
          <div class="list-group" id="memberList"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/friends.js"></script>
  <script src="js/messages.js"></script>
</body>
</html>
