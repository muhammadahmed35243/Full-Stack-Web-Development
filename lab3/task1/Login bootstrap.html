<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        function validateLogin() {
            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;
            let errorMessage = document.getElementById("error-message");

            if (username.trim() === "" || password.trim() === "") {
                errorMessage.textContent = "Username and Password cannot be empty!";
                errorMessage.style.color = "red";
                return false;
            } else {
                alert("Login Successful!");
                return true;
            }
        }

        function togglePassword() {
            let passwordField = document.getElementById("password");
            passwordField.type = (passwordField.type === "password") ? "text" : "password";
        }
    </script>
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light h4llo">
    <div class="card p-4" style="width: 350px;">
        <h3 class="text-center">Login</h3>
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" id="username" class="form-control" placeholder="Enter username">
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <div class="input-group">
                <input type="password" id="password" class="form-control" placeholder="Enter password">
                <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">👁</button>
            </div>
        </div>
        <p id="error-message"></p>
        <button class="btn btn-primary w-100" onclick="validateLogin()">Login</button>
    </div>
</body>
</html>
