<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopEasy - Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-expand navbar-dark bg-dark px-3">
    <a class="navbar-brand fw-bold" href="index.html">ShopEasy</a>
    <div class="navbar-nav me-auto">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="index.html#products">Products</a>
      <a class="nav-link" href="index.html#reviews">Reviews</a>
    </div>
    <div class="navbar-nav">
      <a class="nav-link active" href="login.html">Login</a>
      <a class="nav-link" href="signup.html">Signup</a>
      <a class="nav-link" href="cart.html">Cart (2)</a>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h3 class="text-center mb-4">Login</h3>
            <form>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="you@example.com">
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" placeholder="Your password">
              </div>
              <button class="btn btn-primary w-100" type="button">Login</button>
            </form>
            <p class="text-center small mt-3 mb-0">New here? <a href="signup.html">Create an account</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="bg-dark text-light text-center py-3">
    <small>&copy; 2026 ShopEasy. All rights reserved.</small>
  </footer>

</body>
</html>
