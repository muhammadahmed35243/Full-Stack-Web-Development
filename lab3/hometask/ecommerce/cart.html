<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopEasy - Cart</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-expand navbar-dark bg-dark px-3">
    <a class="navbar-brand fw-bold" href="index.html">ShopEasy</a>
    <div class="navbar-nav me-auto">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="index.html#products">Products</a>
      <a class="nav-link" href="index.html#reviews">Reviews</a>
    </div>
    <div class="navbar-nav">
      <a class="nav-link" href="login.html">Login</a>
      <a class="nav-link" href="signup.html">Signup</a>
      <a class="nav-link active" href="cart.html">Cart (2)</a>
    </div>
  </nav>

  <div class="container py-5">
    <h2 class="mb-4">Your Cart</h2>

    <div class="table-responsive">
      <table class="table align-middle bg-white shadow-sm">
        <thead class="table-light">
          <tr>
            <th>Product</th>
            <th>Price</th>
            <th style="width: 130px;">Quantity</th>
            <th>Subtotal</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Wireless Headphones</td>
            <td>$59.00</td>
            <td><input type="number" class="form-control" value="1" min="1"></td>
            <td>$59.00</td>
            <td>
              <button class="btn btn-outline-primary btn-sm me-1" type="button">Update</button>
              <button class="btn btn-outline-danger btn-sm" type="button">Remove</button>
            </td>
          </tr>
          <tr>
            <td>Smart Watch</td>
            <td>$89.00</td>
            <td><input type="number" class="form-control" value="1" min="1"></td>
            <td>$89.00</td>
            <td>
              <button class="btn btn-outline-primary btn-sm me-1" type="button">Update</button>
              <button class="btn btn-outline-danger btn-sm" type="button">Remove</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="d-flex justify-content-end align-items-center gap-3">
      <h5 class="mb-0">Total: $148.00</h5>
      <a href="checkout.html" class="btn btn-success">Checkout</a>
    </div>
  </div>

  <footer class="bg-dark text-light text-center py-3">
    <small>&copy; 2026 ShopEasy. All rights reserved.</small>
  </footer>

</body>
</html>
