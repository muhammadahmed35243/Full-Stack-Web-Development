<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopEasy - Checkout</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-expand navbar-dark bg-dark px-3">
    <a class="navbar-brand fw-bold" href="index.html">ShopEasy</a>
    <div class="navbar-nav me-auto">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="index.html#products">Products</a>
      <a class="nav-link" href="index.html#reviews">Reviews</a>
    </div>
    <div class="navbar-nav">
      <a class="nav-link" href="login.html">Login</a>
      <a class="nav-link" href="signup.html">Signup</a>
      <a class="nav-link" href="cart.html">Cart (2)</a>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row g-4">

      <div class="col-lg-7">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h4 class="mb-3">Shipping Details</h4>
            <form>
              <div class="mb-3">
                <label class="form-label">Full name</label>
                <input type="text" class="form-control" placeholder="Muhammad Ahmed">
              </div>
              <div class="mb-3">
                <label class="form-label">Address</label>
                <input type="text" class="form-control" placeholder="Street, city">
              </div>
              <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="tel" class="form-control" placeholder="03XX XXXXXXX">
              </div>

              <h4 class="mt-4 mb-3">Payment</h4>
              <div class="mb-3">
                <label class="form-label">Card number</label>
                <input type="text" class="form-control" placeholder="1234 5678 9012 3456">
              </div>
              <div class="row g-3 mb-4">
                <div class="col-6">
                  <label class="form-label">Expiry</label>
                  <input type="text" class="form-control" placeholder="MM/YY">
                </div>
                <div class="col-6">
                  <label class="form-label">CVV</label>
                  <input type="text" class="form-control" placeholder="123">
                </div>
              </div>

              <button class="btn btn-success btn-lg w-100" type="button">Place Order</button>
            </form>
          </div>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h4 class="mb-3">Order Summary</h4>
            <ul class="list-group list-group-flush mb-3">
              <li class="list-group-item d-flex justify-content-between px-0">
                <span>Wireless Headphones</span><span>$59.00</span>
              </li>
              <li class="list-group-item d-flex justify-content-between px-0">
                <span>Smart Watch</span><span>$89.00</span>
              </li>
              <li class="list-group-item d-flex justify-content-between px-0">
                <span>Delivery</span><span>Free</span>
              </li>
              <li class="list-group-item d-flex justify-content-between px-0 fw-bold">
                <span>Total</span><span>$148.00</span>
              </li>
            </ul>
          </div>
        </div>
      </div>

    </div>
  </div>

  <footer class="bg-dark text-light text-center py-3">
    <small>&copy; 2026 ShopEasy. All rights reserved.</small>
  </footer>

</body>
</html>
