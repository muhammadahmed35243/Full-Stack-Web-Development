<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Music Player Card</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="player">

    <p class="eyebrow">NOW PLAYING</p>

    <div class="vinyl">
      <div class="vinyl-label"></div>
    </div>

    <h1 class="track-title">Midnight Frequencies</h1>
    <p class="track-artist">The FSWD Collective</p>

    <div class="equalizer" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="progress">
      <div class="progress-fill"></div>
    </div>
    <div class="time-row">
      <span>1:47</span>
      <span>3:58</span>
    </div>

    <div class="controls">
      <button class="ctrl-btn" title="Previous">&#9198;</button>
      <button class="btn btn-primary play-btn" title="Play/Pause">&#9654;</button>
      <button class="ctrl-btn" title="Next">&#9197;</button>
    </div>

    <div class="bottom-row">
      <input type="checkbox" id="like-toggle" class="like-check">
      <label for="like-toggle" class="like-btn">&#9825; Like</label>

      <div class="volume">
        <span>&#128266;</span>
        <div class="vol-bar"><div class="vol-fill"></div></div>
      </div>
    </div>

  </main>

</body>
</html>
